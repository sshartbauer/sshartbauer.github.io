<script>
  // Runs before React/Babel load so the theme is applied before first
  // paint — no flash of the wrong palette. Targets <html> (not <body>)
  // because CSS variables must cascade from a selector that exists
  // before React mounts into #root.
  (function () {
    var THEMES = ['light', 'dark', 'amoled', 'hc'];
    var stored = localStorage.getItem('theme');
    var theme = THEMES.indexOf(stored) !== -1 ? stored : 'light';
    document.documentElement.setAttribute('data-theme', theme);

    window.setTheme = function (next) {
      if (THEMES.indexOf(next) === -1) return;
      var root = document.documentElement;
      root.style.transition = 'none';
      root.setAttribute('data-theme', next);
      void root.offsetHeight;
      requestAnimationFrame(function () { root.style.transition = ''; });
      localStorage.setItem('theme', next);
    };
  })();
</script>
