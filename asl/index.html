<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASL Flashcards</title>
  <style>
    /* Light theme — default */
    :root {
      --bg: #FDFCFA;
      --surface: rgba(22,32,43,0.035);
      --surface2: rgba(22,32,43,0.06);
      --border: rgba(22,32,43,0.15);
      --accent: #5b3fd1;
      --accent2: #4c2fb0;
      --accent3: #0e7fb8;
      --green: #0b8457;
      --text: #0F1720;
      --muted: #33404D;
      --front-bg: #ede9fb;
      --back-bg: #e7f3f5;
    }

    /* Dark theme — original palette */
    body[data-theme="dark"] {
      --bg: #0f0f13;
      --surface: #1a1a24;
      --surface2: #22223a;
      --border: #2e2e4a;
      --accent: #7c6af7;
      --accent2: #a78bfa;
      --accent3: #38bdf8;
      --green: #34d399;
      --text: #e8e8f0;
      --muted: #8888aa;
      --front-bg: #1a1a2e;
      --back-bg: #16213e;
    }

    /* AMOLED theme — same accents as Dark, true-black background */
    body[data-theme="amoled"] {
      --bg: #000000;
      --surface: rgba(255,255,255,0.04);
      --surface2: rgba(255,255,255,0.07);
      --border: #2e2e4a;
      --accent: #7c6af7;
      --accent2: #a78bfa;
      --accent3: #38bdf8;
      --green: #34d399;
      --text: #e8e8f0;
      --muted: #8888aa;
      --front-bg: #1a1a2e;
      --back-bg: #16213e;
    }

    /* High Contrast theme */
    body[data-theme="hc"] {
      --bg: #000000;
      --surface: rgba(255,255,255,0.06);
      --surface2: rgba(255,255,255,0.12);
      --border: rgba(255,255,255,0.25);
      --accent: #FDFCDC;
      --accent2: #FDFCDC;
      --accent3: #FDFCDC;
      --green: #FDFCDC;
      --text: #ffffff;
      --muted: #cccccc;
      --front-bg: #FDFCDC;
      --back-bg: #FDFCDC;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--accent2), var(--accent3));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header p {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 4px;
    }

    /* Group filter tabs */
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 24px;
    }

    .tab {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
      transition: all 0.2s;
      letter-spacing: 0.3px;
    }

    .tab:hover { border-color: var(--accent); color: var(--accent2); }
    .tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* Theme picker */
    .theme-bar {
      width: 100%;
      max-width: 580px;
      display: flex;
      justify-content: flex-end;
      margin-bottom: 10px;
    }

    .theme-select-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
    }

    .theme-select {
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--muted);
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      padding: 6px 26px 6px 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .theme-select option {
      background: var(--bg);
      color: var(--text);
      font-weight: 400;
    }

    .theme-select:hover,
    .theme-select:focus {
      border-color: var(--accent);
      color: var(--accent2);
      outline: none;
    }

    .theme-select-wrap::after {
      content: '';
      position: absolute;
      right: 12px;
      top: 50%;
      width: 6px;
      height: 6px;
      border-right: 1px solid var(--muted);
      border-bottom: 1px solid var(--muted);
      transform: translateY(-70%) rotate(45deg);
      pointer-events: none;
    }

    .theme-select-wrap:hover::after {
      border-color: var(--accent);
    }

    /* Progress bar */
    .progress-wrap {
      width: 100%;
      max-width: 580px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .progress-bar {
      flex: 1;
      height: 5px;
      background: var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent3));
      border-radius: 10px;
      transition: width 0.35s ease;
    }

    .counter {
      font-size: 0.8rem;
      color: var(--muted);
      white-space: nowrap;
    }

    /* Card scene */
    .scene {
      width: 100%;
      max-width: 560px;
      height: 360px;
      perspective: 1200px;
      cursor: pointer;
      margin-bottom: 20px;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.55s cubic-bezier(0.4, 0.2, 0.2, 1);
    }

    .card.flipped { transform: rotateY(180deg); }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 18px;
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* FRONT */
    .card-front {
      background: radial-gradient(ellipse at 30% 30%, #1e1b4b 0%, #0f0f1a 70%);
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    /* Note: the flashcard face is a deliberately fixed dark panel (front/back
       gradients below are hardcoded, not theme vars) so its accent colors are
       pinned to the original dark-theme literal values — they stay legible on
       that panel regardless of which site theme is active. */
    .card-front .group-label {
      position: absolute;
      top: 16px;
      left: 20px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #7c6af7;
      opacity: 0.7;
    }

    .card-front .hint {
      position: absolute;
      bottom: 16px;
      color: #8888aa;
      font-size: 0.75rem;
    }

    .card-front .main-word {
      font-size: 7rem;
      font-weight: 900;
      letter-spacing: -4px;
      line-height: 1;
      background: linear-gradient(135deg, #fff 30%, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      user-select: none;
    }

    .card-front .sub-label {
      font-size: 1rem;
      color: #8888aa;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 500;
    }

    /* BACK */
    .card-back {
      background: radial-gradient(ellipse at 70% 20%, #0c1a3a 0%, #0a0a14 80%);
      transform: rotateY(180deg);
      flex-direction: column;
    }

    .back-top {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 24px 12px;
      border-bottom: 1px solid var(--border);
      text-align: center;
      gap: 6px;
    }

    .back-top .section-label {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #7c6af7;
    }

    .back-top .handshape-text {
      font-size: 1rem;
      line-height: 1.5;
      color: #e8e8f0;
      font-weight: 500;
    }

    .back-bottom {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      height: 130px;
      flex-shrink: 0;
    }

    .back-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px 12px;
      text-align: center;
      gap: 5px;
    }

    .back-cell + .back-cell {
      border-left: 1px solid var(--border);
    }

    .back-cell .cell-label {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .back-cell.location .cell-label  { color: #34d399; }
    .back-cell.movement .cell-label  { color: #38bdf8; }
    .back-cell.facial .cell-label    { color: #f9a8d4; }

    body[data-theme="hc"] .card-front .group-label,
    body[data-theme="hc"] .back-top .section-label,
    body[data-theme="hc"] .back-cell.location .cell-label,
    body[data-theme="hc"] .back-cell.movement .cell-label,
    body[data-theme="hc"] .back-cell.facial .cell-label { color: #FDFCDC; }

    body[data-theme="hc"] .card-front .main-word {
      background: linear-gradient(135deg, #fff, #FDFCDC);
      -webkit-background-clip: text;
      background-clip: text;
    }

    .back-cell .cell-text {
      font-size: 0.82rem;
      color: #e8e8f0;
      line-height: 1.4;
      opacity: 0.9;
    }

    /* Controls */
    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 22px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 600;
      transition: all 0.18s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover { border-color: var(--accent); color: var(--accent2); transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.primary:hover { background: var(--accent2); border-color: var(--accent2); color: #fff; }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

    /* Quiz mode */
    .quiz-area {
      width: 100%;
      max-width: 560px;
      display: none;
    }

    .quiz-area.active { display: block; }

    .quiz-prompt {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px 24px;
      margin-bottom: 16px;
      text-align: center;
    }

    .quiz-prompt .q-label {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .quiz-prompt .q-word {
      font-size: 4rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--text), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .quiz-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .quiz-opt {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      cursor: pointer;
      font-size: 0.85rem;
      line-height: 1.4;
      transition: all 0.18s;
      color: var(--text);
      text-align: left;
    }

    .quiz-opt:hover { border-color: var(--accent); }
    .quiz-opt.correct { border-color: var(--green); background: rgba(52,211,153,0.12); color: var(--green); }
    .quiz-opt.wrong   { border-color: #f87171; background: rgba(248,113,113,0.1); color: #f87171; }

    .quiz-score {
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 14px;
    }

    /* Mode toggle */
    .mode-row {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .mode-btn {
      flex: 1;
      max-width: 140px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
      text-align: center;
      transition: all 0.18s;
    }

    .mode-btn.active { background: var(--surface2); border-color: var(--accent); color: var(--accent2); }

    /* Keyboard hint */
    .key-hints {
      color: var(--muted);
      font-size: 0.74rem;
      text-align: center;
      margin-top: 6px;
    }

    .key-hints kbd {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 5px;
      font-family: inherit;
      font-size: 0.72rem;
    }

    /* ── Mobile (additive only — desktop unchanged) ─────────────────────── */
    @media (max-width: 640px) {
      img, svg, video, iframe { max-width: 100%; height: auto; }

      body { padding: 16px 12px 40px; }
      header { margin-bottom: 20px; }
      header h1 { font-size: clamp(1.5rem, 6.5vw, 2rem); }

      /* Touch-friendly tap targets (>=44px) */
      .tab {
        padding: 10px 16px;
        font-size: 0.85rem;
        min-height: 44px;
        display: inline-flex;
        align-items: center;
      }
      .theme-bar { justify-content: center; margin-bottom: 14px; }
      .theme-select { min-height: 44px; padding: 10px 30px 10px 16px; font-size: 0.85rem; }
      .mode-btn { padding: 11px 12px; min-height: 44px; font-size: 0.9rem; max-width: none; }
      .btn { padding: 12px 18px; min-height: 44px; font-size: 0.95rem; justify-content: center; }
      .controls { width: 100%; justify-content: center; flex-wrap: wrap; }
      .mode-row { width: 100%; max-width: 320px; }

      /* Card: taller to fit stacked back cells; scale huge letter down */
      .scene { height: 460px; }
      .card-front .main-word { font-size: clamp(3.5rem, 22vw, 5rem); letter-spacing: -2px; }
      .card-front .sub-label { font-size: 0.9rem; }
      .card-back { overflow-y: auto; }
      .back-top { padding: 18px 16px 14px; }
      .back-top .handshape-text { font-size: 0.95rem; }

      /* Stack the 3-column back grid into a single column */
      .back-bottom { grid-template-columns: 1fr; height: auto; }
      .back-cell { padding: 12px 16px; }
      .back-cell + .back-cell { border-left: none; border-top: 1px solid var(--border); }
      .back-cell .cell-text { font-size: 0.95rem; }

      /* Quiz: single-column options, readable text, big tap areas */
      .quiz-prompt { padding: 16px 18px; }
      .quiz-prompt .q-word { font-size: clamp(2.4rem, 13vw, 3.2rem); }
      .quiz-options { grid-template-columns: 1fr; }
      .quiz-opt { font-size: 0.95rem; padding: 14px 16px; min-height: 44px; }
      .quiz-score { font-size: 0.95rem; }
      .counter { font-size: 0.85rem; }
    }
  </style>
</head>
<body>
<script>
  (function () {
    var THEMES = ['light', 'dark', 'amoled', 'hc'];
    var stored = localStorage.getItem('theme');
    var theme = THEMES.indexOf(stored) !== -1 ? stored : 'light';
    document.body.setAttribute('data-theme', theme);

    window.setTheme = function (next) {
      if (THEMES.indexOf(next) === -1) return;
      var body = document.body;
      body.style.transition = 'none';
      body.setAttribute('data-theme', next);
      void body.offsetHeight;
      requestAnimationFrame(function () { body.style.transition = ''; });
      localStorage.setItem('theme', next);
    };

    document.addEventListener('DOMContentLoaded', function () {
      var select = document.getElementById('theme-select');
      if (select) select.value = theme;
    });
  })();
</script>

<div class="theme-bar">
  <div class="theme-select-wrap">
    <select id="theme-select" class="theme-select" onchange="setTheme(this.value)" aria-label="Choose color theme">
      <option value="light">Light</option>
      <option value="dark">Dark</option>
      <option value="amoled">AMOLED</option>
      <option value="hc">High Contrast</option>
    </select>
  </div>
</div>

<header>
  <h1>ASL Flashcards</h1>
  <p>Alphabet · Numbers · Week by Week</p>
</header>

<!-- Mode toggle -->
<div class="mode-row">
  <div class="mode-btn active" id="modeStudy" onclick="setMode('study')">📖 Study</div>
  <div class="mode-btn" id="modeQuiz" onclick="setMode('quiz')">🎯 Quiz</div>
</div>

<!-- Group tabs -->
<div class="tabs" id="tabs"></div>

<!-- Progress bar -->
<div class="progress-wrap">
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="counter" id="counter">1 / 1</div>
</div>

<!-- Study mode card -->
<div class="scene" id="scene" onclick="flipCard()">
  <div class="card" id="card">
    <!-- Front -->
    <div class="card-face card-front">
      <span class="group-label" id="frontGroup"></span>
      <div class="main-word" id="frontWord"></div>
      <div class="sub-label" id="frontSub"></div>
      <span class="hint">tap to flip</span>
    </div>
    <!-- Back -->
    <div class="card-face card-back">
      <div class="back-top">
        <div class="section-label">Handshape</div>
        <div class="handshape-text" id="backHandshape"></div>
      </div>
      <div class="back-bottom">
        <div class="back-cell location">
          <div class="cell-label">Location</div>
          <div class="cell-text" id="backLocation"></div>
        </div>
        <div class="back-cell movement">
          <div class="cell-label">Movement</div>
          <div class="cell-text" id="backMovement"></div>
        </div>
        <div class="back-cell facial">
          <div class="cell-label">Facial Expr.</div>
          <div class="cell-text" id="backFacial"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Study controls -->
<div class="controls" id="studyControls">
  <button class="btn" id="prevBtn" onclick="navigate(-1)">← Prev</button>
  <button class="btn primary" onclick="shuffleCards()">⇄ Shuffle</button>
  <button class="btn" id="nextBtn" onclick="navigate(1)">Next →</button>
</div>

<div class="key-hints" id="studyHints">
  <kbd>←</kbd> <kbd>→</kbd> navigate &nbsp;·&nbsp; <kbd>Space</kbd> flip
</div>

<!-- Quiz mode -->
<div class="quiz-area" id="quizArea">
  <div class="quiz-prompt">
    <div class="q-label">What is the handshape for…</div>
    <div class="q-word" id="quizWord"></div>
  </div>
  <div class="quiz-options" id="quizOptions"></div>
  <div class="quiz-score" id="quizScore"></div>
  <div style="display:flex;gap:10px;justify-content:center">
    <button class="btn primary" onclick="nextQuiz()">Next Question →</button>
    <button class="btn" onclick="resetQuizScore()">Reset Score</button>
  </div>
</div>

// ─── STATE ────────────────────────────────────────────────────────────────────
const groups = ['All', ...[ ...new Set(signs.map(s => s.group)) ]];
let activeGroup = 'All';
let filtered = [...signs];
let idx = 0;
let isFlipped = false;
let mode = 'study'; // 'study' | 'quiz'
let quizCorrect = 0, quizTotal = 0;
let quizAnswered = false;

// ─── INIT ─────────────────────────────────────────────────────────────────────
function init() {
  buildTabs();
  setGroup('All');
}

function buildTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = '';
  groups.forEach(g => {
    const d = document.createElement('div');
    d.className = 'tab' + (g === activeGroup ? ' active' : '');
    d.textContent = g === 'All' ? `All (${signs.length})` : `${g} (${signs.filter(s=>s.group===g).length})`;
    d.onclick = () => setGroup(g);
    el.appendChild(d);
  });
}

function setGroup(g) {
  activeGroup = g;
  filtered = g === 'All' ? [...signs] : signs.filter(s => s.group === g);
  idx = 0;
  isFlipped = false;
  document.getElementById('card').classList.remove('flipped');
  buildTabs();
  render();
  if (mode === 'quiz') startQuiz();
}

// ─── STUDY MODE ───────────────────────────────────────────────────────────────
function render() {
  const s = filtered[idx];
  document.getElementById('frontGroup').textContent = s.group;
  document.getElementById('frontWord').textContent = s.front;

  // Sub-label
  let sub = '';
  if (s.group === 'Alphabet') sub = 'Letter';
  else if (s.group.startsWith('Number')) sub = 'Number';
  document.getElementById('frontSub').textContent = sub;

  document.getElementById('backHandshape').textContent = s.handshape;
  document.getElementById('backLocation').textContent = s.location;
  document.getElementById('backMovement').textContent = s.movement;
  document.getElementById('backFacial').textContent = s.facial;

  const pct = filtered.length > 1 ? (idx / (filtered.length - 1)) * 100 : 100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('counter').textContent = `${idx + 1} / ${filtered.length}`;

  document.getElementById('prevBtn').disabled = idx === 0;
  document.getElementById('nextBtn').disabled = idx === filtered.length - 1;
}

function flipCard() {
  isFlipped = !isFlipped;
  document.getElementById('card').classList.toggle('flipped', isFlipped);
}

function navigate(dir) {
  idx = Math.max(0, Math.min(filtered.length - 1, idx + dir));
  isFlipped = false;
  document.getElementById('card').classList.remove('flipped');
  render();
}

function shuffleCards() {
  for (let i = filtered.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [filtered[i], filtered[j]] = [filtered[j], filtered[i]];
  }
  idx = 0;
  isFlipped = false;
  document.getElementById('card').classList.remove('flipped');
  render();
}

// ─── QUIZ MODE ────────────────────────────────────────────────────────────────
let quizCurrent = null;
let quizChoices = [];

function startQuiz() {
  quizAnswered = false;
  quizCurrent = filtered[Math.floor(Math.random() * filtered.length)];
  document.getElementById('quizWord').textContent = quizCurrent.front;

  // Build 4 choices: correct + 3 random wrong
  const pool = signs.filter(s => s.id !== quizCurrent.id);
  const wrong = [];
  while (wrong.length < 3 && pool.length > 0) {
    const r = Math.floor(Math.random() * pool.length);
    wrong.push(pool.splice(r, 1)[0]);
  }
  quizChoices = [quizCurrent, ...wrong].sort(() => Math.random() - 0.5);

  const el = document.getElementById('quizOptions');
  el.innerHTML = '';
  quizChoices.forEach(s => {
    const d = document.createElement('div');
    d.className = 'quiz-opt';
    d.textContent = s.handshape;
    d.onclick = () => answerQuiz(s, d);
    el.appendChild(d);
  });

  updateQuizScore();
}

function answerQuiz(chosen, el) {
  if (quizAnswered) return;
  quizAnswered = true;
  quizTotal++;

  const opts = document.querySelectorAll('.quiz-opt');
  if (chosen.id === quizCurrent.id) {
    el.classList.add('correct');
    quizCorrect++;
  } else {
    el.classList.add('wrong');
    // Highlight correct
    opts.forEach(o => {
      if (o.textContent === quizCurrent.handshape) o.classList.add('correct');
    });
  }
  updateQuizScore();
}

function nextQuiz() {
  startQuiz();
}

function resetQuizScore() {
  quizCorrect = 0; quizTotal = 0;
  updateQuizScore();
  startQuiz();
}

function updateQuizScore() {
  const pct = quizTotal > 0 ? Math.round((quizCorrect / quizTotal) * 100) : '—';
  document.getElementById('quizScore').textContent =
    `Score: ${quizCorrect} / ${quizTotal}  (${pct}%)`;
}

// ─── MODE SWITCH ──────────────────────────────────────────────────────────────
function setMode(m) {
  mode = m;
  document.getElementById('modeStudy').classList.toggle('active', m === 'study');
  document.getElementById('modeQuiz').classList.toggle('active', m === 'quiz');

  document.getElementById('scene').style.display = m === 'study' ? 'block' : 'none';
  document.getElementById('studyControls').style.display = m === 'study' ? 'flex' : 'none';
  document.getElementById('studyHints').style.display = m === 'study' ? 'block' : 'none';
  document.getElementById('quizArea').classList.toggle('active', m === 'quiz');
  document.getElementById('progressFill').closest('.progress-wrap').style.display = m === 'study' ? 'flex' : 'none';

  if (m === 'quiz') startQuiz();
}

// ─── KEYBOARD ─────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (mode !== 'study') return;
  if (e.key === 'ArrowRight') navigate(1);
  else if (e.key === 'ArrowLeft') navigate(-1);
  else if (e.key === ' ') { e.preventDefault(); flipCard(); }
});

init();
</script>
